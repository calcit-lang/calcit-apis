name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: yarn

    - uses: calcit-lang/setup-cr@0.0.9

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - name: "compiles to js"
      run: |
        caps --ci
        memof_snapshot="$(readlink -f .calcit/modules/memof/calcit.cirru)"
        if grep -Fq '&= args $ first cached-pair' "$memof_snapshot"; then
          mkdir -p .calcit/memof-compat
          cp "$memof_snapshot" .calcit/memof-compat/calcit.cirru
          perl -0pi -e 's/&= args \$ first cached-pair/= args \$ option:unwrap (first cached-pair)/' .calcit/memof-compat/calcit.cirru
          ln -sfn ../memof-compat .calcit/modules/memof
        fi
        cr js
        yarn install --immutable
        yarn vite build --base=./

    - name: Deploy to server
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      run: echo "${{ steps.deploy.outputs.status }}"
